# Trong file: thichuong/layer2-data-service/.../railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/layer2_data_service"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Cấu hình Health Check đã sửa
healthcheckMethod = "HTTP" # ĐÃ SỬA: Đổi sang HTTP
healthcheckPath = "/health" # ĐÃ SỬA: Trỏ đến endpoint Axum
healthcheckTimeout = 15000 

# DÒNG CŨ: healthcheckService = "grpc.health.v1.Health"
# DÒNG CŨ: healthcheckPort = 50051

# XÓA healthcheckService và healthcheckPort
# Railway sẽ tự động dùng $PORT