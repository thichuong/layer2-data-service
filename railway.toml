# Railway configuration for Layer2 Data Service
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/layer2_data_service"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckMethod = "GRPC"
healthcheckService = "grpc.health.v1.Health" # Tên service mặc định của tonic-health
healthcheckTimeout = 100
healthcheckPort = 8001

# Environment variables (set these in Railway dashboard)
# Required:
# - SERVICE_PORT (set by Railway as PORT)
# - CMC_API_KEY
# - FINNHUB_API_KEY
# - TAAPI_SECRET
# - TWELVE_DATA_API_KEY
# - REDIS_URL
# - DATABASE_URL
