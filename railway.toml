# Railway configuration for Layer2 Data Service
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/layer2_data_service"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 100

# Environment variables (set these in Railway dashboard)
# Required:
# - SERVICE_PORT (set by Railway as PORT)
# - CMC_API_KEY
# - FINNHUB_API_KEY
# - TAAPI_SECRET
# - TWELVE_DATA_API_KEY
# - REDIS_URL
# - DATABASE_URL
