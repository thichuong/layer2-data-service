[package]
name = "layer2_data_service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["thichuong"]

# Optimized development profile
[profile.dev]
opt-level = 1
debug = true
lto = false
codegen-units = 16
panic = "unwind"
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[dependencies]
# Web framework
axum = { version = "0.6", features = ["json"] }
tokio = { version = "1.28", features = ["full", "sync"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace", "cors"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Environment configuration
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cache dependencies
multi-tier-cache = "0.5.2"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
bb8-redis = "0.15"

# Concurrency
rayon = "1.8"
dashmap = "5.5"
num_cpus = "1.16"
futures = "0.3"

# Performance optimization
lazy_static = "1.4"
parking_lot = "0.12"
ahash = "0.8"
smallvec = "1.11"

# Constraint problematic dependencies
base64ct = "=1.6.0"
backon = "=1.5.0"  # Pin to 1.5.0 to avoid edition2024 requirement

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gRPC
tonic = "0.10"
prost = "0.12"

# Metrics (optional)
# prometheus = { version = "0.13", optional = true }

[build-dependencies]
tonic-build = "0.10"
